<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AMAALA EOC</title>
  <style>
    :root{
      --bg:#0b1020; --card:#0f1a33; --muted:#93a4c7; --text:#eaf0ff;
      --accent:#4f8cff; --ok:#1ed760; --bad:#ff4d4d; --line:#1f2d55;
    }
    [data-theme="light"]{
      --bg:#f6f8ff; --card:#ffffff; --muted:#5a6b93; --text:#0b1020;
      --accent:#2f6bff; --line:#dde6ff;
    }
    body{ margin:0; font-family:system-ui,Segoe UI,Arial; background:var(--bg); color:var(--text); }
    .wrap{ max-width:1100px; margin:0 auto; padding:22px; }
    .top{
      display:flex; gap:14px; align-items:center; justify-content:space-between;
      padding:14px 16px; background:linear-gradient(135deg,var(--card),transparent);
      border:1px solid var(--line); border-radius:16px;
    }
    .brand{ display:flex; align-items:center; gap:12px; }
    .logo{
      width:54px; height:54px; border-radius:14px; background:#fff;
      display:grid; place-items:center; overflow:hidden;
      border:1px solid var(--line);
    }
    .logo img{ width:100%; height:100%; object-fit:contain; }
    h1{ font-size:18px; margin:0; }
    .sub{ color:var(--muted); font-size:12px; margin-top:2px; }
    .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn, select{
      border:1px solid var(--line);
      background:var(--card); color:var(--text);
      padding:10px 12px; border-radius:12px; cursor:pointer;
    }
    .btn.primary{ background:var(--accent); border-color:transparent; color:white; font-weight:700; }
    .grid{ margin-top:16px; display:grid; grid-template-columns:1fr; gap:14px; }
    @media(min-width:980px){ .grid{ grid-template-columns:1fr 1fr; } }
    .card{
      background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:14px;
    }
    .tabs{ display:flex; gap:10px; margin-top:14px; }
    .tab{ padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer; }
    .tab.active{ background:var(--accent); border-color:transparent; color:white; font-weight:700; }
    textarea{
      width:100%; min-height:210px; resize:vertical;
      padding:12px; border-radius:14px; border:1px solid var(--line);
      background:transparent; color:var(--text); outline:none;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
    .pill{ border:1px solid var(--line); padding:8px 10px; border-radius:999px; color:var(--muted); font-size:12px; }
    .list{ margin:10px 0 0; padding-left:18px; color:var(--muted); }
    .result{
      white-space:pre-wrap; background:rgba(255,255,255,0.03);
      border:1px solid var(--line); padding:12px; border-radius:14px; min-height:120px;
    }
    .danger{ border-color:var(--bad) !important; box-shadow:0 0 0 2px rgba(255,77,77,0.2) inset; }
    .good{ border-color:var(--ok) !important; box-shadow:0 0 0 2px rgba(30,215,96,0.15) inset; }
    .small{ font-size:12px; color:var(--muted); }
    .split{ display:grid; gap:10px; grid-template-columns:1fr; }
    @media(min-width:980px){ .split{ grid-template-columns:1fr 1fr; } }
    .muted{ color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="top">
      <div class="brand">
        <div class="logo"><img id="logoImg" alt="AMAALA EOC" /></div>
        <div>
          <h1 id="t_title">AMAALA EOC</h1>
          <div class="sub" id="t_sub">Chat + Check Report (AI)</div>
        </div>
      </div>

      <div class="controls">
        <select id="langSel" class="btn">
          <option value="en">English</option>
          <option value="ar">العربية</option>
        </select>
        <button class="btn" id="themeBtn">Theme</button>
        <label class="btn" style="cursor:pointer">
          <input id="logoPick" type="file" accept="image/*" style="display:none">
          <span id="t_logo">Logo</span>
        </label>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabChat">Chat</button>
      <button class="tab" id="tabReport">Check Report</button>
    </div>

    <div class="grid">
      <!-- LEFT -->
      <div class="card">
        <div id="chatView">
          <div class="pill" id="t_chatHint">Talk to AMAALA EOC Assistant</div>
          <textarea id="chatInput" placeholder="Type a message..."></textarea>
          <div class="row">
            <button class="btn primary" id="chatSend">Send</button>
            <span class="small" id="chatStatus"></span>
          </div>
          <div class="result" id="chatOut"></div>
        </div>

        <div id="reportView" style="display:none">
          <div class="pill" id="t_reportHint">Paste the incident report, then click Check Report</div>
          <textarea id="reportInput" placeholder="Paste report here..."></textarea>

          <div class="row">
            <input id="protectedTerms" class="btn" style="flex:1; min-width:240px"
              placeholder="Protected terms (comma) e.g., ICAD,TBCV,AMAALA" />
            <button class="btn primary" id="reportRun">Check Report</button>
            <span class="small" id="reportStatus"></span>
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="card">
        <div class="split">
          <div>
            <div class="pill" id="t_final">Final Output</div>
            <div class="result" id="finalOut"></div>
          </div>
          <div>
            <div class="pill" id="t_analysis">Timeline Analysis</div>
            <div class="result" id="timelineBox"></div>
          </div>
        </div>

        <div class="split" style="margin-top:10px">
          <div>
            <div class="pill" id="t_companies">Detected Companies</div>
            <div class="result" id="companiesOut"></div>
          </div>
          <div>
            <div class="pill" id="t_changes">Adjusted Words Only</div>
            <div class="result" id="changesOut"></div>
          </div>
        </div>

        <div class="small muted" style="margin-top:10px" id="t_footer">
          Tip: If Timeline Analysis turns red, there are timestamp issues.
        </div>
      </div>
    </div>
  </div>

<script>
  // ====== EDIT ME ======
  const WORKER_BASE = "https://black-cloud-2eb0.md00700tabuk.workers.dev";
  const AUTH_TOKEN = ""; // if you set AUTH_TOKEN secret, put the same here
  // =====================

  const $ = (id)=>document.getElementById(id);

  // Default logo (if none uploaded)
  const defaultLogo = "data:image/svg+xml;base64," + btoa(`
    <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">
      <rect width="120" height="120" rx="18" fill="#ffffff"/>
      <text x="60" y="62" text-anchor="middle" font-size="36" font-family="Arial" fill="#0b1020">EOC</text>
      <text x="60" y="90" text-anchor="middle" font-size="12" font-family="Arial" fill="#2f6bff">AMAALA</text>
    </svg>
  `);
  $("logoImg").src = defaultLogo;

  // Theme
  let theme = localStorage.getItem("theme") || "dark";
  setTheme(theme);

  $("themeBtn").onclick = () => {
    theme = (theme === "dark") ? "light" : "dark";
    setTheme(theme);
  };
  function setTheme(t){
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "");
    localStorage.setItem("theme", t);
  }

  // Tabs
  $("tabChat").onclick = () => switchTab("chat");
  $("tabReport").onclick = () => switchTab("report");
  function switchTab(tab){
    const isChat = tab === "chat";
    $("tabChat").classList.toggle("active", isChat);
    $("tabReport").classList.toggle("active", !isChat);
    $("chatView").style.display = isChat ? "" : "none";
    $("reportView").style.display = isChat ? "none" : "";
  }

  // i18n
  const i18n = {
    en: {
      sub:"Chat + Check Report (AI)",
      logo:"Logo",
      chatHint:"Talk to AMAALA EOC Assistant",
      reportHint:"Paste the incident report, then click Check Report",
      final:"Final Output",
      analysis:"Timeline Analysis",
      companies:"Detected Companies",
      changes:"Adjusted Words Only",
      footer:"Tip: If Timeline Analysis turns red, there are timestamp issues.",
      chatPH:"Type a message...",
      reportPH:"Paste report here...",
    },
    ar: {
      sub:"شات + تدقيق التقرير (AI)",
      logo:"الشعار",
      chatHint:"تحدث مع مساعد مركز عمليات الطوارئ",
      reportHint:"الصق التقرير ثم اضغط تدقيق التقرير",
      final:"المخرجات النهائية",
      analysis:"تحليل التسلسل الزمني",
      companies:"الشركات المكتشفة",
      changes:"الكلمات المعدلة فقط",
      footer:"معلومة: إذا صار تحليل التسلسل الزمني أحمر، فيه مشكلة في الأوقات.",
      chatPH:"اكتب رسالتك...",
      reportPH:"الصق التقرير هنا...",
    }
  };

  $("langSel").onchange = applyLang;
  function applyLang(){
    const lang = $("langSel").value;
    document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";
    $("t_sub").textContent = i18n[lang].sub;
    $("t_logo").textContent = i18n[lang].logo;
    $("t_chatHint").textContent = i18n[lang].chatHint;
    $("t_reportHint").textContent = i18n[lang].reportHint;
    $("t_final").textContent = i18n[lang].final;
    $("t_analysis").textContent = i18n[lang].analysis;
    $("t_companies").textContent = i18n[lang].companies;
    $("t_changes").textContent = i18n[lang].changes;
    $("t_footer").textContent = i18n[lang].footer;
    $("chatInput").placeholder = i18n[lang].chatPH;
    $("reportInput").placeholder = i18n[lang].reportPH;
  }
  applyLang();

  // Logo upload
  $("logoPick").addEventListener("change", (e)=>{
    const file = e.target.files?.[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = ()=>{ $("logoImg").src = r.result; };
    r.readAsDataURL(file);
  });

  function authHeader(){
    return AUTH_TOKEN ? { "Authorization": "Bearer " + AUTH_TOKEN } : {};
  }

  // Chat
  $("chatSend").onclick = async ()=>{
    $("chatStatus").textContent = "Working...";
    const lang = $("langSel").value;
    const msg = $("chatInput").value.trim();
    if(!msg){ $("chatStatus").textContent=""; return; }

    try{
      const res = await fetch(WORKER_BASE + "/chat", {
        method:"POST",
        headers:{ "Content-Type":"application/json", ...authHeader() },
        body: JSON.stringify({ message: msg, lang })
      });
      const data = await res.json();
      $("chatOut").textContent = data.reply || JSON.stringify(data, null, 2);
      $("finalOut").textContent = data.reply || "";
      $("chatStatus").textContent = res.ok ? "Done ✅" : "Error ❌";
    }catch(err){
      $("chatStatus").textContent = "Error ❌";
      $("chatOut").textContent = String(err);
    }
  };

  // Report (ALL tasks in one button)
  $("reportRun").onclick = async ()=>{
    $("reportStatus").textContent = "Checking...";
    resetOutputs();

    const lang = $("langSel").value;
    const report = $("reportInput").value.trim();
    const protectedTerms = $("protectedTerms").value
      .split(",")
      .map(s=>s.trim())
      .filter(Boolean);

    if(!report){ $("reportStatus").textContent=""; return; }

    try{
      const res = await fetch(WORKER_BASE + "/report", {
        method:"POST",
        headers:{ "Content-Type":"application/json", ...authHeader() },
        body: JSON.stringify({ report, lang, protectedTerms })
      });

      const data = await res.json();

      // Final
      $("finalOut").textContent = data.final_report || "";

      // Companies
      $("companiesOut").textContent = (data.detected_companies || []).join("\n") || "-";

      // Changes
      $("changesOut").textContent = (data.changes || []).join("\n") || "-";

      // Timeline analysis (RED if issues)
      const issues = data.time_issues || [];
      const box = $("timelineBox");
      box.textContent = issues.length ? issues.join("\n") : "No timestamp issues ✅";
      box.classList.toggle("danger", issues.length > 0);
      box.classList.toggle("good", issues.length === 0);

      $("reportStatus").textContent = res.ok ? "Done ✅" : "Error ❌";
      if(!res.ok){
        $("timelineBox").classList.add("danger");
        $("timelineBox").textContent = JSON.stringify(data, null, 2);
      }
    }catch(err){
      $("reportStatus").textContent = "Error ❌";
      $("timelineBox").classList.add("danger");
      $("timelineBox").textContent = String(err);
    }
  };

  function resetOutputs(){
    $("finalOut").textContent = "";
    $("companiesOut").textContent = "";
    $("changesOut").textContent = "";
    $("timelineBox").textContent = "";
    $("timelineBox").classList.remove("danger","good");
  }
</script>
</body>
</html>
