<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AMAALA EOC</title>

<style>
:root{
  --bg:#f6f8ff; --card:#ffffff; --muted:#5a6b93; --text:#0b1020;
  --accent:#2f6bff; --ok:#1ed760; --bad:#ff4d4d; --line:#dde6ff;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,Segoe UI,Arial;
  background:var(--bg);color:var(--text)
}
.wrap{max-width:1200px;margin:0 auto;padding:22px}
.top{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:14px 18px
}
.brand{display:flex;gap:12px;align-items:center}
.logo{
  width:54px;height:54px;border-radius:14px;
  border:1px solid var(--line);
  display:grid;place-items:center;background:#fff
}
.logo img{width:100%;height:100%;object-fit:contain}
h1{margin:0;font-size:18px}
.sub{font-size:12px;color:var(--muted)}

.controls{display:flex;gap:10px}
.btn,select,input{
  border:1px solid var(--line);
  background:#fff;padding:10px 12px;
  border-radius:12px;cursor:pointer
}
.btn.primary{
  background:var(--accent);color:#fff;border:none;font-weight:700
}

.grid{
  display:grid;grid-template-columns:1fr;gap:16px;margin-top:18px
}
@media(min-width:1000px){
  .grid{grid-template-columns:1.2fr 1fr}
}

.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:16px;overflow:hidden
}

.pill{
  display:inline-block;padding:6px 10px;
  border:1px solid var(--line);
  border-radius:999px;font-size:12px;color:var(--muted)
}

/* CHAT */
.chatBox{
  height:320px;border:1px solid var(--line);
  border-radius:14px;padding:12px;
  overflow:auto;background:#f9fbff
}
.msg{margin:10px 0;display:flex}
.msg.bot{justify-content:flex-start}
.msg.me{justify-content:flex-end}
.bubble{
  max-width:78%;padding:10px 12px;
  border-radius:14px;border:1px solid var(--line);
  background:#eef3ff;white-space:pre-wrap
}
.msg.me .bubble{background:#dbe7ff}
.name{font-size:11px;color:var(--muted);margin-bottom:4px}

.chatRow{display:flex;gap:10px;margin-top:10px}
.chatRow input{flex:1}

/* REPORT */
textarea{
  width:100%;min-height:220px;
  border-radius:14px;border:1px solid var(--line);
  padding:12px;resize:vertical
}

.result{
  border:1px solid var(--line);
  border-radius:14px;padding:12px;
  background:#f9fbff;
  white-space:pre-wrap;overflow:auto
}
.danger{border-color:var(--bad)}
.good{border-color:var(--ok)}

.dashboard2{
  display:grid;gap:12px
}
@media(min-width:1000px){
  .dashboard2{grid-template-columns:1fr 1fr}
}

.small{font-size:12px;color:var(--muted)}
</style>
</head>

<body>
<div class="wrap">

<!-- HEADER -->
<div class="top">
  <div class="brand">
    <div class="logo"><img src="" id="logoImg"></div>
    <div>
      <h1>AMAALA EOC</h1>
      <div class="sub">EOC Operator · Chat & Report Check</div>
    </div>
  </div>
  <div class="controls">
    <select id="langSel">
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>
    <button class="btn" id="themeBtn">Theme</button>
    <label class="btn">
      Logo<input type="file" hidden id="logoPick">
    </label>
  </div>
</div>

<div class="grid">

<!-- LEFT -->
<div class="card">
  <span class="pill">EOC Operator (Chat)</span>
  <div class="chatBox" id="chatBox"></div>

  <div class="chatRow">
    <input id="chatInput" placeholder="Type message…">
    <button class="btn primary" id="sendBtn">Send</button>
  </div>

  <hr style="margin:16px 0;border:none;border-top:1px solid var(--line)">

  <span class="pill">Check Report</span>
  <textarea id="reportInput" placeholder="Paste the incident report here…"></textarea>

  <div class="chatRow">
    <input id="protectedTerms" placeholder="Protected terms e.g. ICAD,TBCV,AMAALA">
    <button class="btn primary" id="checkBtn">Check Report</button>
  </div>
</div>

<!-- RIGHT -->
<div class="card">

  <!-- FINAL OUTPUT -->
  <span class="pill">Final Output</span>
  <div class="result" id="finalOut" style="min-height:220px;max-height:320px"></div>

  <!-- TIMELINE + COMPANIES -->
  <div class="dashboard2" style="margin-top:14px">
    <div>
      <span class="pill">Timeline Analysis</span>
      <div class="result" id="timelineOut" style="min-height:140px"></div>
    </div>
    <div>
      <span class="pill">Detected Companies</span>
      <div class="result" id="companiesOut" style="min-height:140px"></div>
    </div>
  </div>

  <!-- CHANGES -->
  <div style="margin-top:14px">
    <span class="pill">Adjusted Words Only</span>
    <div class="result" id="changesOut" style="min-height:180px;max-height:260px"></div>
  </div>

  <div class="small" style="margin-top:10px">
    If Timeline Analysis turns red, timestamps need correction.
  </div>
</div>

</div>
</div>

<script>
const WORKER_BASE="https://black-cloud-2eb0.md00700tabuk.workers.dev";
const chatBox=document.getElementById("chatBox");

function addMsg(role,name,text){
  const row=document.createElement("div");
  row.className="msg "+role;
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.innerHTML="<div class='name'>"+name+"</div>"+text;
  row.appendChild(bubble);
  chatBox.appendChild(row);
  chatBox.scrollTop=chatBox.scrollHeight;
}

addMsg("bot","EOC Operator","Ready. Paste a report or ask a question.");

document.getElementById("sendBtn").onclick=async()=>{
  const msg=document.getElementById("chatInput").value.trim();
  if(!msg)return;
  addMsg("me","You",msg);
  document.getElementById("chatInput").value="";
  const r=await fetch(WORKER_BASE+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg})});
  const d=await r.json();
  addMsg("bot","EOC Operator",d.reply||"No reply");
};

document.getElementById("checkBtn").onclick=async()=>{
  ["finalOut","timelineOut","companiesOut","changesOut"].forEach(id=>document.getElementById(id).textContent="");
  const report=document.getElementById("reportInput").value;
  const terms=document.getElementById("protectedTerms").value.split(",").map(x=>x.trim()).filter(Boolean);
  const r=await fetch(WORKER_BASE+"/report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({report,protectedTerms:terms})});
  const d=await r.json();

  document.getElementById("finalOut").textContent=d.final_report||"-";
  document.getElementById("companiesOut").textContent=(d.detected_companies||[]).join("\n")||"-";
  document.getElementById("changesOut").textContent=(d.changes||[]).join("\n")||"-";

  const t=document.getElementById("timelineOut");
  if(d.time_issues?.length){
    t.classList.add("danger");
    t.textContent=d.time_issues.join("\n");
  }else{
    t.classList.remove("danger");
    t.classList.add("good");
    t.textContent="No timestamp issues ✅";
  }
};
</script>
</body>
</html>
