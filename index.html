<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AMAALA EOC</title>

  <style>
    :root{
      --bg:#0b1020; --card:#0f1a33; --muted:#93a4c7; --text:#eaf0ff;
      --accent:#4f8cff; --ok:#1ed760; --bad:#ff4d4d; --line:#1f2d55;
      --soft: rgba(255,255,255,0.04);
    }
    [data-theme="light"]{
      --bg:#f6f8ff; --card:#ffffff; --muted:#5a6b93; --text:#0b1020;
      --accent:#2f6bff; --line:#dde6ff; --soft:#f9fbff;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,Segoe UI,Arial; background:var(--bg); color:var(--text); }
    .wrap{ max-width:1200px; margin:0 auto; padding:22px; }

    .top{
      display:flex; gap:14px; align-items:center; justify-content:space-between;
      padding:14px 16px; background:linear-gradient(135deg,var(--card),transparent);
      border:1px solid var(--line); border-radius:18px;
    }
    .brand{ display:flex; align-items:center; gap:12px; min-width:280px; }
    .logo{
      width:56px; height:56px; border-radius:14px; background:#fff;
      display:grid; place-items:center; overflow:hidden; border:1px solid var(--line);
      flex:0 0 auto;
    }
    .logo img{ width:100%; height:100%; object-fit:contain; }
    h1{ font-size:18px; margin:0; }
    .sub{ color:var(--muted); font-size:12px; margin-top:2px; }

    .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
    .btn, select, input{
      border:1px solid var(--line);
      background:var(--card);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
    }
    .btn{ cursor:pointer; }
    .btn.primary{ background:var(--accent); border-color:transparent; color:white; font-weight:800; }

    .grid{ margin-top:16px; display:grid; grid-template-columns:1fr; gap:14px; }
    @media(min-width:1000px){ .grid{ grid-template-columns:1.15fr 0.85fr; } }

    .card{
      background:var(--card); border:1px solid var(--line);
      border-radius:18px; padding:14px; overflow:hidden; min-width:0;
    }

    .pill{
      border:1px solid var(--line);
      padding:7px 10px; border-radius:999px;
      color:var(--muted); font-size:12px; display:inline-block;
    }

    /* Chat UI */
    .chatBox{
      height:320px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      overflow:auto;
      background:var(--soft);
    }
    .msg{ display:flex; margin:10px 0; }
    .msg.bot{ justify-content:flex-start; }
    .msg.me{ justify-content:flex-end; }
    .bubble{
      max-width:80%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,0.04);
      white-space:pre-wrap;
      word-break:break-word;
    }
    .msg.me .bubble{
      background:rgba(79,140,255,0.18);
      border-color:rgba(79,140,255,0.35);
    }
    .nameLine{
      font-size:11px;
      color:var(--muted);
      margin-bottom:4px;
    }
    .chatInputRow{
      display:flex; gap:10px; margin-top:10px;
    }
    .chatInputRow input{ flex:1; min-width:0; outline:none; }

    /* Report UI */
    textarea{
      width:100%;
      min-height:220px;
      max-height:420px;
      resize:vertical;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      outline:none;
      overflow:auto;
      display:block;
      min-width:0;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
    .row > *{ min-width:0; }

    /* Right outputs */
    .result{
      white-space:pre-wrap;
      background:var(--soft);
      border:1px solid var(--line);
      padding:12px;
      border-radius:14px;
      min-height:120px;
      overflow:auto;
      min-width:0;
    }
    .danger{ border-color:var(--bad) !important; box-shadow:0 0 0 2px rgba(255,77,77,0.20) inset; }
    .good{ border-color:var(--ok) !important; box-shadow:0 0 0 2px rgba(30,215,96,0.15) inset; }

    .dashboard2{
      display:grid;
      gap:12px;
      grid-template-columns:1fr;
      margin-top:12px;
    }
    @media(min-width:1000px){
      .dashboard2{ grid-template-columns:1fr 1fr; }
    }
    .small{ font-size:12px; color:var(--muted); }
    a{ color:var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    /* Tips */
    .tipsBox{
      margin-top:14px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background:var(--soft);
    }
    .tipsTitle{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .tipsText{ margin-top:10px; white-space:pre-wrap; }
    .refs{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
    .refItem{ font-size:12px; color:var(--muted); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo"><img id="logoImg" alt="AMAALA EOC Logo"/></div>
        <div>
          <h1>AMAALA EOC</h1>
          <div class="sub" id="subTxt">EOC Operator (Chat) + Check Report (AI)</div>
        </div>
      </div>

      <div class="controls">
        <select id="langSel">
          <option value="en">English</option>
          <option value="ar">العربية</option>
        </select>
        <button class="btn" id="themeBtn">Theme</button>
        <label class="btn" style="cursor:pointer">
          <input id="logoPick" type="file" accept="image/*" style="display:none">
          <span id="logoTxt">Logo</span>
        </label>
      </div>
    </div>

    <div class="grid">
      <!-- LEFT COLUMN -->
      <div class="card">
        <div class="pill" id="chatPill">EOC Operator (Chat)</div>

        <div class="chatBox" id="chatBox"></div>

        <div class="chatInputRow">
          <input id="chatInput" placeholder="Type a message..." />
          <button class="btn primary" id="sendBtn">Send</button>
        </div>

        <hr style="border:0;border-top:1px solid var(--line); margin:14px 0; opacity:.7">

        <div class="pill" id="reportPill">Check Report</div>

        <textarea id="reportInput" placeholder="Paste the incident report here..."></textarea>

        <div class="row">
          <input id="protectedTerms" style="flex:1; min-width:260px"
                 placeholder="Protected terms (comma) e.g., ICAD,TBCV,AMAALA" />
          <button class="btn primary" id="checkBtn">Check Report</button>
        </div>

        <!-- Tips Section -->
        <div class="tipsBox" id="tipsBox">
          <div class="tipsTitle">
            <span class="pill" id="tipsPill">Tips</span>
            <span class="small" id="tipsHint"></span>
          </div>
          <div class="tipsText" id="tipsText"></div>
          <div class="refs" id="tipsRefs"></div>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="card">
        <div class="pill" id="finalPill">Final Output</div>
        <div class="result" id="finalOut" style="min-height:220px; max-height:320px;"></div>

        <div class="dashboard2">
          <div>
            <div class="pill" id="timelinePill">Timeline Analysis</div>
            <div class="result" id="timelineOut" style="min-height:140px; max-height:180px;"></div>
          </div>

          <div>
            <div class="pill" id="companiesPill">Detected Companies</div>
            <div class="result" id="companiesOut" style="min-height:140px; max-height:180px;"></div>
          </div>
        </div>

        <div style="margin-top:12px">
          <div class="pill" id="changesPill">Adjusted Words Only</div>
          <div class="result" id="changesOut" style="min-height:180px; max-height:280px;"></div>
        </div>

        <div class="small" style="margin-top:10px">
          Tip: If Timeline Analysis turns red, there are timestamp issues.
        </div>
      </div>
    </div>
  </div>

<script>
  // ====== EDIT ME ======
  const WORKER_BASE = "https://black-cloud-2eb0.md00700tabuk.workers.dev";
  const AUTH_TOKEN = ""; // if you set AUTH_TOKEN secret, put the same here
  // =====================

  const $ = (id)=>document.getElementById(id);

  // ✅ Default logo (always shows)
  const defaultLogo = "data:image/svg+xml;base64," + btoa(`
    <svg xmlns="http://www.w3.org/2000/svg" width="140" height="140">
      <rect width="140" height="140" rx="22" fill="#ffffff"/>
      <text x="70" y="76" text-anchor="middle" font-size="44" font-family="Arial" fill="#0b1020">EOC</text>
      <text x="70" y="104" text-anchor="middle" font-size="14" font-family="Arial" fill="#2f6bff">AMAALA</text>
    </svg>
  `);
  $("logoImg").src = localStorage.getItem("amaala_logo") || defaultLogo;

  // ✅ Logo upload (works + saves)
  $("logoPick").addEventListener("change", (e)=>{
    const file = e.target.files?.[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = ()=>{
      $("logoImg").src = r.result;
      localStorage.setItem("amaala_logo", r.result);
    };
    r.readAsDataURL(file);
  });

  // ✅ Theme toggle (works + saves)
  let theme = localStorage.getItem("theme") || "dark";
  setTheme(theme);
  $("themeBtn").onclick = () => {
    theme = (theme === "dark") ? "light" : "dark";
    setTheme(theme);
  };
  function setTheme(t){
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "");
    localStorage.setItem("theme", t);
  }

  // i18n labels
  const i18n = {
    en: {
      sub:"EOC Operator (Chat) + Check Report (AI)",
      logo:"Logo",
      chatPH:"Type a message...",
      reportPH:"Paste the incident report here...",
      chatPill:"EOC Operator (Chat)",
      reportPill:"Check Report",
      final:"Final Output",
      timeline:"Timeline Analysis",
      companies:"Detected Companies",
      changes:"Adjusted Words Only",
      send:"Send",
      check:"Check Report",
      tips:"Tips",
      tipsHint:"Auto-refresh tip",
      tipRefs:"References:"
    },
    ar: {
      sub:"مشغل مركز العمليات (شات) + تدقيق التقرير (AI)",
      logo:"الشعار",
      chatPH:"اكتب رسالتك...",
      reportPH:"الصق التقرير هنا...",
      chatPill:"EOC Operator (شات)",
      reportPill:"تدقيق التقرير",
      final:"المخرجات النهائية",
      timeline:"تحليل التسلسل الزمني",
      companies:"الشركات المكتشفة",
      changes:"الكلمات المعدلة فقط",
      send:"إرسال",
      check:"تدقيق التقرير",
      tips:"نصائح",
      tipsHint:"نصيحة تتغير مع التحديث",
      tipRefs:"المراجع:"
    }
  };

  $("langSel").onchange = applyLang;
  function applyLang(){
    const lang = $("langSel").value;
    document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";
    $("subTxt").textContent = i18n[lang].sub;
    $("logoTxt").textContent = i18n[lang].logo;
    $("chatInput").placeholder = i18n[lang].chatPH;
    $("reportInput").placeholder = i18n[lang].reportPH;

    $("chatPill").textContent = i18n[lang].chatPill;
    $("reportPill").textContent = i18n[lang].reportPill;

    $("finalPill").textContent = i18n[lang].final;
    $("timelinePill").textContent = i18n[lang].timeline;
    $("companiesPill").textContent = i18n[lang].companies;
    $("changesPill").textContent = i18n[lang].changes;

    $("sendBtn").textContent = i18n[lang].send;
    $("checkBtn").textContent = i18n[lang].check;

    $("tipsPill").textContent = i18n[lang].tips;
    $("tipsHint").textContent = i18n[lang].tipsHint;

    renderTip(); // regenerate tip in selected language
  }
  applyLang();

  function authHeader(){
    return AUTH_TOKEN ? { "Authorization": "Bearer " + AUTH_TOKEN } : {};
  }

  // Chat bubbles
  const chatBox = $("chatBox");
  function addMsg(role, name, text){
    const row = document.createElement("div");
    row.className = "msg " + (role === "me" ? "me" : "bot");

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const n = document.createElement("div");
    n.className = "nameLine";
    n.textContent = name;

    const t = document.createElement("div");
    t.textContent = text;

    bubble.appendChild(n);
    bubble.appendChild(t);
    row.appendChild(bubble);

    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  addMsg("bot", "EOC Operator", "Ready. Paste your message or ask me to check a report.");

  async function sendChat(){
    const lang = $("langSel").value;
    const msg = $("chatInput").value.trim();
    if(!msg) return;

    addMsg("me", "You", msg);
    $("chatInput").value = "";

    try{
      const res = await fetch(WORKER_BASE + "/chat", {
        method:"POST",
        headers:{ "Content-Type":"application/json", ...authHeader() },
        body: JSON.stringify({ message: msg, lang })
      });
      const data = await res.json();
      if(!res.ok){
        addMsg("bot", "EOC Operator", "Error: " + JSON.stringify(data));
        return;
      }
      addMsg("bot", "EOC Operator", data.reply || "(no reply)");
    }catch(err){
      addMsg("bot", "EOC Operator", "Error: " + String(err));
    }
  }

  $("sendBtn").onclick = sendChat;
  $("chatInput").addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){
      e.preventDefault();
      sendChat();
    }
  });

  // Report
  function clearOutputs(){
    $("finalOut").textContent = "";
    $("timelineOut").textContent = "";
    $("companiesOut").textContent = "";
    $("changesOut").textContent = "";
    $("timelineOut").classList.remove("danger","good");
  }

  $("checkBtn").onclick = async ()=>{
    clearOutputs();

    const lang = $("langSel").value;
    const report = $("reportInput").value.trim();
    const protectedTerms = $("protectedTerms").value
      .split(",").map(s=>s.trim()).filter(Boolean);

    if(!report) return;

    try{
      const res = await fetch(WORKER_BASE + "/report", {
        method:"POST",
        headers:{ "Content-Type":"application/json", ...authHeader() },
        body: JSON.stringify({ report, lang, protectedTerms })
      });
      const data = await res.json();

      if(!res.ok){
        $("finalOut").textContent = "Error ❌";
        $("timelineOut").classList.add("danger");
        $("timelineOut").textContent = JSON.stringify(data, null, 2);
        return;
      }

      $("finalOut").textContent = data.final_report || "-";
      $("companiesOut").textContent = (data.detected_companies || []).join("\n") || "-";
      $("changesOut").textContent = (data.changes || []).join("\n") || "-";

      const issues = data.time_issues || [];
      $("timelineOut").textContent = issues.length ? issues.join("\n") : "No timestamp issues ✅";
      $("timelineOut").classList.toggle("danger", issues.length > 0);
      $("timelineOut").classList.toggle("good", issues.length === 0);

    }catch(err){
      $("timelineOut").classList.add("danger");
      $("timelineOut").textContent = String(err);
    }
  };

  // ✅ APCO Tips (auto per refresh) + references links
  const apcoTips = [
    {
      en: "Use a structured call-handling flow: confirm location first, identify the incident type, then gather critical details before concluding with clear next steps.",
      ar: "استخدم تسلسل منظم لاستلام البلاغ: ثبّت الموقع أولاً، ثم نوع البلاغ، ثم التفاصيل الحرجة، وأنهِ المكالمة بخطوات واضحة.",
      refs: [
        { label:"APCO – Public Safety Communications Incident Handling Process (Standard Candidate PDF)", url:"https://www.apcointl.org/~documents/standard/11132-202x-candidate-psc-incident-handling-process" }
      ]
    },
    {
      en: "When providing pre-arrival guidance, keep instructions short, actionable, and locally approved (guidecards/protocols).",
      ar: "عند إعطاء إرشادات ما قبل وصول الفرق، خلّها قصيرة وواضحة ومعتمدة محليًا (Guidecards/Protocols).",
      refs: [
        { label:"APCO – EMD Program (Guidecards & structured medical call handling)", url:"https://www.apcointl.org/training/emd-program/" }
      ]
    },
    {
      en: "Build operator resilience: recognize stress signs early, use quick reset techniques, and apply long-term stress management strategies.",
      ar: "ادعم استدامة أداء المشغّل: انتبه لمؤشرات الضغط بدري، وطبّق تقنيات تهدئة سريعة، وخطط لإدارة الضغط على المدى الطويل.",
      refs: [
        { label:"APCO – Training & Education (Surviving Stress for Telecommunicators)", url:"https://www.apcointl.org/training/" }
      ]
    },
    {
      en: "Standardize training: ensure telecommunicators receive minimum core knowledge/skills and refresh training for veteran staff.",
      ar: "وحّد التدريب: تأكد من الحد الأدنى للمعارف والمهارات الأساسية، مع تحديث تدريب الموظفين القدامى بشكل دوري.",
      refs: [
        { label:"APCO – Minimum Training Standards for Public Safety Telecommunicators (3.103.3-2025)", url:"https://www.apcointl.org/standards/3-103-3-2025-minimum-training-standards-for-public-safety-telecommunicators/" }
      ]
    }
  ];

  function pickTip(){
    // new tip each refresh: use time-based randomness
    const idx = Math.floor((Date.now() / 1000) % apcoTips.length);
    return apcoTips[idx];
  }

  function renderTip(){
    const lang = $("langSel").value;
    const tip = pickTip();

    $("tipsText").textContent = (lang === "ar") ? tip.ar : tip.en;

    // refs
    const refsEl = $("tipsRefs");
    refsEl.innerHTML = "";

    const title = document.createElement("div");
    title.className = "refItem";
    title.textContent = (lang === "ar") ? "المراجع:" : "References:";
    refsEl.appendChild(title);

    tip.refs.forEach(r=>{
      const div = document.createElement("div");
      div.className = "refItem";
      const a = document.createElement("a");
      a.href = r.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = r.label;
      div.appendChild(a);
      refsEl.appendChild(div);
    });
  }

  // generate tip on first load (and every refresh naturally)
  renderTip();
</script>
</body>
</html>
